security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    google:
      pattern: ^/google/callback
      provider: app_user_provider
      custom_authenticator:
        - App\Security\GoogleAuthenticator
      logout:
        path: logout_route
        target: /

    auth0:
      pattern: ^/loginAuth0
      provider: app_user_provider
      custom_authenticator:
        - App\Security\Auth0Authenticator
      logout:
        path: logout_route
        target: /

    main:
      provider: app_user_provider
      custom_authenticator:
        - App\Security\SecurityControllerAuthenticator
      logout:
        path: logout_route
        target: /