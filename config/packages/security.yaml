security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # Firewall pour l'authentification Google
    google_auth:
      pattern: ^/google
      provider: app_user_provider
      custom_authenticator: App\Security\GoogleAuthenticator
      entry_point: App\Security\GoogleAuthenticator
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800
      logout:
        path: app_logout
        target: app_index

    # Firewall principal pour l'authentification par credentials
    main:
      pattern: ^/
      provider: app_user_provider
      custom_authenticator: App\Security\SecurityControllerAuthenticator
      entry_point: App\Security\SecurityControllerAuthenticator
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800
      logout:
        path: app_logout
        target: app_index

  access_control:
    # Routes publiques
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/register, roles: PUBLIC_ACCESS }
    - { path: ^/google/connect, roles: PUBLIC_ACCESS }
    - { path: ^/google/callback, roles: PUBLIC_ACCESS }
    - { path: ^/auth0/callback, roles: PUBLIC_ACCESS }

    # Routes protégées
    - { path: ^/profile, roles: ROLE_USER }
